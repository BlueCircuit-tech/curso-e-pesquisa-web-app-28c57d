<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ConectaPesquisa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              black: '#0A0A0A',
              gold: '#D4AF37',
              cream: '#FAFAFA',
              'gold-dark': '#B8982E',
              'gold-light': '#E8CC6E',
              'gray-900': '#141414',
              'gray-800': '#1E1E1E',
              'gray-700': '#2A2A2A',
              'gray-600': '#3D3D3D',
              'gray-500': '#6B6B6B',
              'gray-400': '#8E8E8E',
              'gray-300': '#B0B0B0',
              'gray-200': '#D4D4D4',
              'gray-100': '#E8E8E8',
              'gray-50': '#F5F5F5',
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      height: 64px;
      color: #6B6B6B;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.25s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      background: none;
      border: none;
      padding: 0;
      position: relative;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
      transition: stroke 0.25s ease;
    }

    .nav-btn.ativo {
      color: #D4AF37;
    }

    .nav-btn.ativo::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      background: #D4AF37;
      border-radius: 0 0 3px 3px;
    }

    .screen {
      display: none;
    }

    .card-interactive {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .card-interactive:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-gray-black font-sans text-gray-cream antialiased">

  <div class="max-w-[430px] mx-auto min-h-screen flex flex-col bg-gray-black relative">

    <main class="flex-1 overflow-y-auto pb-20" id="conteudo-principal">
      <!-- TELAS -->
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 max-w-[430px] mx-auto">
      <div class="bg-gray-black/95 backdrop-blur-md border-t border-gray-700/60 flex items-stretch shadow-[0_-4px_20px_rgba(0,0,0,0.4)]">
        <button class="nav-btn ativo" data-nav="painel-inicial" onclick="mostrarTela('painel-inicial')" aria-label="Painel Inicial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V10z"/><polyline points="9 21 9 13 15 13 15 21"/></svg>
          <span>Início</span>
        </button>
        <button class="nav-btn" data-nav="pesquisar-relatorios" onclick="mostrarTela('pesquisar-relatorios')" aria-label="Pesquisar Relatórios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Pesquisar</span>
        </button>
        <button class="nav-btn" data-nav="visualizar-relatorio" onclick="mostrarTela('visualizar-relatorio')" aria-label="Visualizar Relatório">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Relatórios</span>
        </button>
        <button class="nav-btn" data-nav="cursos-e-palestras" onclick="mostrarTela('cursos-e-palestras')" aria-label="Cursos e Palestras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <span>Cursos</span>
        </button>
        <button class="nav-btn" data-nav="player-do-curso" onclick="mostrarTela('player-do-curso')" aria-label="Player do Curso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>Player</span>
        </button>
        <button class="nav-btn" data-nav="suporte-e-ajuda" onclick="mostrarTela('suporte-e-ajuda')" aria-label="Suporte e Ajuda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Suporte</span>
        </button>
      </div>
    </nav>

  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-inicial');
    });
  </script>

</body>
</html>
